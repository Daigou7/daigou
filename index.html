<style>
:root{
  /* BACKGROUND */
  --background:url("https://imgur.com/kCq7NMO.png");
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
}

body{
  display:grid;
  place-items:center;
  padding:20px;
  overflow:hidden;

  font-family:Inter,sans-serif;
  color:#fff;

  background:
    linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.28)),
    var(--background) center/cover fixed;
}

/* SOMBRA / ATMOSFERA */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(circle at center,transparent 30%,rgba(0,0,0,.32) 100%),
    linear-gradient(to bottom,rgba(255,255,255,.015),transparent 30%);
}

/* CAIXA */
.container{
  position:relative;
  width:min(340px,100%);
  padding:34px 28px;

  text-align:center;
  overflow:hidden;

  background:#000;

  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;

  box-shadow:
    0 20px 70px rgba(0,0,0,.8),
    0 0 0 1px rgba(255,255,255,.025),
    inset 0 0 30px rgba(255,255,255,.018);

  animation:up .8s cubic-bezier(.22,1,.36,1);
}

/* BORDA INTERNA */
.container::before{
  content:"";
  position:absolute;
  inset:4px;

  border:1px solid rgba(255,255,255,.035);
  border-radius:14px;

  pointer-events:none;
}

/* LINHA BRANCA PASSANDO */
.container::after{
  content:"";
  position:absolute;
  top:0;
  left:-60%;

  width:35%;
  height:1px;

  background:#fff;
  box-shadow:
    0 0 6px rgba(255,255,255,.7),
    0 0 14px rgba(255,255,255,.2);

  animation:scan 6s linear infinite;
}

/* NOME */
h1{
  margin-bottom:12px;

  font-size:34px;
  font-weight:700;
  letter-spacing:6px;

  color:#fff;

  text-shadow:
    0 0 8px rgba(255,255,255,.18),
    0 0 22px rgba(255,255,255,.06);

  animation:glow 4s ease-in-out infinite alternate;
}

/* BIO */
.bio{
  margin-bottom:26px;

  font-size:13px;
  line-height:1.9;
  color:rgba(255,255,255,.55);

  opacity:0;
  animation:up .7s .2s forwards;
}

/* LINKS */
.links{
  display:flex;
  justify-content:center;
  gap:16px;
}

/* BOTÕES */
.btn{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  width:48px;
  height:48px;

  overflow:hidden;
  text-decoration:none;

  background:#000;

  border:1px solid rgba(255,255,255,.13);
  border-radius:12px;

  box-shadow:
    inset 0 0 14px rgba(255,255,255,.015);

  opacity:0;

  animation:up .6s forwards;

  transition:
    transform .25s,
    border-color .25s,
    background .25s,
    box-shadow .25s;
}

/* REFLEXO */
.btn::before{
  content:"";
  position:absolute;
  inset:-40%;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.12),
    transparent
  );

  transform:translateX(-100%) rotate(12deg);
  transition:.6s;
}

.btn:hover::before{
  transform:translateX(100%) rotate(12deg);
}

.btn:hover{
  transform:translateY(-3px);

  border-color:rgba(255,255,255,.55);

  background:#080808;

  box-shadow:
    0 0 12px rgba(255,255,255,.08),
    inset 0 0 14px rgba(255,255,255,.025);
}

/* ÍCONES */
.btn img{
  width:21px;
  height:21px;

  object-fit:contain;

  filter:
    grayscale(1)
    brightness(1.5)
    drop-shadow(0 0 4px rgba(255,255,255,.22));

  opacity:.8;

  transition:
    transform .25s,
    opacity .25s,
    filter .25s;
}

.btn:hover img{
  transform:scale(1.1);

  opacity:1;

  filter:
    grayscale(1)
    brightness(2)
    drop-shadow(0 0 6px rgba(255,255,255,.35));
}

/* DELAY DOS BOTÕES */
.btn:nth-child(1){animation-delay:.3s}
.btn:nth-child(2){animation-delay:.4s}
.btn:nth-child(3){animation-delay:.5s}
.btn:nth-child(4){animation-delay:.6s}
.btn:nth-child(5){animation-delay:.7s}

/* ANIMAÇÕES */
@keyframes up{
  from{
    opacity:0;
    transform:translateY(22px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes glow{
  from{
    text-shadow:
      0 0 5px rgba(255,255,255,.12);
  }

  to{
    text-shadow:
      0 0 10px rgba(255,255,255,.25),
      0 0 24px rgba(255,255,255,.08);
  }
}

@keyframes scan{
  to{
    left:125%;
  }
}
</style>
